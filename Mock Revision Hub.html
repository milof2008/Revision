const O=(h,q,o,e)=>({k:"order",h,q,o,e});
const EGUIDE=[
{m:5,t:"5 min",split:"KAA only, no evaluation",how:"Definition (1) + application from data (1–2) + one short chain (2). Usually also a multiple-choice part: annotate, eliminate, then explain why the right answer is right."},
{m:8,t:"8 min",split:"6 KAA + 2 EV",how:"Two separate points. Each needs a definition, a piece of data from the extract and a chain of reasoning. Then ONE developed evaluation (why it may not hold here)."},
{m:10,t:"10 min",split:"6 KAA + 4 EV",how:"Accurate, labelled diagram that shows the change. Two chains linked to the diagram and data, then two evaluation points with reasoning."},
{m:12,t:"12 min",split:"8 KAA + 4 EV",how:"As the 10-marker, with deeper analysis. Use the specific tool the question asks for (e.g. a payoff matrix). Without it, KAA is capped."},
{m:15,t:"15 min",split:"9 KAA + 6 EV",how:"Two to three well-developed points, each with data and chains. Evaluate after each point, then a short judgement. Two strong points beat three thin ones."},
{m:25,t:"30 min",split:"16 KAA + 9 EV",how:"Intro (define key terms) → KAA 1 (concept, real-world example, 4–5 step chain, diagram) → EV 1 → KAA 2 → EV 2 → conclusion with a supported judgement ('it depends on…' + the deciding factor). Evaluation must be sustained, not just a final 'however'."}];
SK.econ=[
{id:"e0",title:"Evaluation toolkit",m:0,kind:"econ",q:"Learn the evaluation tools examiners reward, and how to tell strong evaluation from weak.",
items:[{label:"Toolkit",text:"<b>MINT-SPED-style prompts you can use on almost any question:</b><br>• <b>Magnitude</b>: how big is the effect? Use the data.<br>• <b>Time period</b>: short run vs long run.<br>• <b>Elasticity</b>: PED/PES change who is affected and by how much.<br>• <b>Stakeholders</b>: consumers, firms, workers, government, third parties.<br>• <b>Assumptions</b>: ceteris paribus, rational agents, perfect information.<br>• <b>Information gaps & government failure</b>: can the policy be set at the right level?<br>• <b>It depends on…</b>: name the ONE factor that decides the outcome, and say why.<br><br>Examiners say strong evaluation weighs scale or significance and explains <i>why</i> the point might not hold in this context. A bare 'however, this might not work' or a summary earns nothing.",
steps:[
M("Weak vs strong","Which is the STRONGEST evaluation of 'a sugar tax will cut consumption'?",["However, the tax might not work.","However, demand for sugary drinks is relatively price inelastic because of habit and few close substitutes, so a 20% price rise may cut quantity only slightly. The tax may raise revenue more than it changes behaviour, unless firms reformulate.","However, some people like sugar.","In conclusion, the tax has pros and cons."],1,"It names the factor (PED), explains the chain behind it, gives a sense of size, and reaches a conditional judgement."),
X("Spot the evaluation","Tick ALL the statements that count as genuine evaluation",["In the short run supply is inelastic, so the price spike is large. But in the long run new producers enter and the price falls back.","The effect depends on how much of the cost saving the monopsonist passes on to consumers, which is unlikely if it also has monopoly power in its selling market.","A monopoly is a firm with over 25% market share.","Overall, this essay has looked at both sides.","The extract shows only a 2% fall in emissions after the permit price collapsed, suggesting too many permits were issued."],[0,1,4],"Definitions and summaries aren't evaluation. Strong evaluation uses time, conditions or data to question the size or validity of the analysis."),
M("Causes vs effects","A question asks you to evaluate the CAUSES of government failure. Where should your evaluation focus?",["On how significant each cause is and whether it applies in the case given","On the effects of government failure on consumers","On listing every cause you know","On policies to reduce inflation"],0,"Examiners note that evaluating effects when asked about causes is a common error and caps marks."),
M("Judgement","What makes a top-level conclusion in a 25-marker?",["Repeating the main points","A supported judgement that answers the question and names the key deciding factor","Saying 'it depends' with no reason","Introducing a brand-new argument"],1,"'It depends on X, because…' plus a clear verdict. Never just a summary."),
W("<b>Example: national minimum wage.</b> The impact on unemployment depends mainly on the wage elasticity of demand for labour. In sectors like social care, where labour can't easily be replaced by machines and demand is inelastic, a rise in the minimum wage may cost few jobs. In sectors such as retail, self-checkouts offer a substitute, so job losses could be larger. In the short run firms may absorb the cost through lower profits, but in the long run they can automate. The overall effect is therefore likely to be small if the rise is modest relative to average earnings, but significant in low-margin, easily automated sectors.")]}]},
{id:"e1",title:"8-marker: factors affecting PES",m:8,kind:"econ",q:"With reference to the extract, examine two factors that influence the price elasticity of supply of wheat. (8 marks)",
items:[{label:"Extract",prov:"Practice extract, written for revision. Figures are illustrative.",text:"Global wheat prices rose by 35% in 2022 after poor harvests and the war in Ukraine disrupted exports. Farmers in other countries could not respond quickly: wheat takes around nine months to grow, and storage capacity in many exporting nations was already near full. By 2024, planted area in Argentina and Australia had risen by 8%, and prices had fallen back by a quarter.",
steps:[
M("Structure","How should an 8-marker 'examine' be structured?",["One point, fully developed, with no evaluation","Two separate points (definition, data, chain), then one developed evaluation","Three points with no data","A diagram and a conclusion only"],1,"Split: about 6 marks KAA and 2 marks EV. Examiners stress two separate application comments when two points are required."),
X("Application","Tick ALL the extract data you could use as application",["Prices rose 35% in 2022","Wheat takes around nine months to grow","Storage capacity was already near full","Planted area rose 8% by 2024","The government banned wheat exports"],[0,1,2,3],"The export ban isn't in the extract. Only use what's given or real, well-known facts."),
O("Chain of reasoning","Put this chain for 'time / production lag' in the correct order",["Wheat takes around nine months to grow","so farmers cannot increase output quickly when the price rises","so quantity supplied barely responds in the short run","so PES is inelastic (less than 1)","so the 35% price rise was large and persistent"],"Each link spelled out, no jumps. Examiners reward step-by-step chains."),
X("Evaluation","Tick ALL the valid evaluation points",["Over time PES becomes more elastic: planted area rose 8% by 2024 and prices fell back","Spare storage would make supply more elastic, so the factor matters less in years with lower stocks","PES of wheat is always perfectly inelastic","Weather shocks can override farmers' plans, so even long-run supply is uncertain"],[0,1,3],"'Always perfectly inelastic' is wrong: supply responded over time."),
W("<b>Factor 1: time / production lag.</b> PES measures how responsive quantity supplied is to a change in price. Wheat takes about nine months to grow, so when prices rose 35% in 2022 farmers could not increase output in the short run. Quantity supplied barely responded, making PES inelastic, so the price rise was large.<br><br><b>Factor 2: stock levels.</b> Firms with high stocks can release them when prices rise. But storage in many exporting nations was already near full and was being run down, leaving little extra supply to release quickly. This also made PES inelastic.<br><br><b>Evaluation:</b> the time period is the dominant factor. By 2024 planted area had risen 8% and prices had fallen by a quarter, showing supply becomes more elastic in the long run. However, weather means even planned increases in supply are uncertain.")]}]},
{id:"e2",title:"10-marker: indirect tax diagram",m:10,kind:"econ",q:"With reference to the extract and an indirect tax diagram, assess the likely impact of the soft drinks levy on producers and consumers. (10 marks)",
items:[{label:"Extract",prov:"Practice extract, written for revision. Figures are illustrative.",text:"The UK soft drinks levy charges producers 24p per litre on drinks with the highest sugar content. Before it began, many manufacturers cut sugar below the threshold. Prices of the affected drinks rose by an average of 18p per litre, and sales volumes of high-sugar drinks fell by around 10% in the first year. The levy raised about £300 million a year.",
steps:[
M("Structure","Mark split and what the 10-marker needs?",["6 KAA + 4 EV: a correct diagram showing the change, two chains linked to data, then two developed evaluation points","10 KAA, no evaluation","5 KAA + 5 EV with no diagram","Only a diagram"],0,"Diagrams earn marks only if correct, labelled and linked to the question."),
DGQ("tax"),
M("Tax incidence","The levy is 24p, and the price rose 18p. What share of the tax burden fell on consumers?",["25%","75%","18%","100%"],1,"18 ÷ 24 = 75%. The producer burden is 6p (25%). Show this on the diagram as the split of the tax rectangle."),
O("Chain","Order the chain explaining the effect on producers",["The levy raises producers' costs by 24p per litre","so supply shifts vertically upward by the tax","so price rises by less than the tax (18p) and quantity falls","so producers keep only P2 minus the tax per unit, 6p less than before","so producer surplus and revenue fall, giving an incentive to reformulate"],"Link the diagram to each step."),
X("Evaluation","Tick ALL the strong evaluation points",["Demand appears price inelastic (a 10% fall in quantity after a ~15–20% price rise), so the tax raises revenue more than it changes behaviour","The biggest effect came from reformulation before the levy started, which a static diagram doesn't show","Taxes are always bad","The levy is regressive: lower-income households spend a larger share of income on these drinks","Consumers may switch to untaxed sugary products such as sweets or milkshakes"],[0,1,3,4],"Each one challenges the size or validity of the analysis using context."),
W("An indirect tax is a tax on spending that raises firms' costs. The 24p levy shifts supply vertically upward from S1 to S1+tax. Price rises from P1 to P2 (by 18p per litre) and quantity falls from Q1 to Q2, about 10%. Consumers pay 18p of the tax (75%) and producers 6p (25%), shown by the split of the tax rectangle. Government revenue is the whole rectangle, about £300m. Producers lose revenue and surplus, so they have an incentive to cut sugar below the threshold.<br><br><b>Evaluation:</b> the main effect may come from reformulation, which a static diagram cannot show: many firms cut sugar before the levy started, so the long-run impact on health may be larger than the 10% fall suggests. However, demand seems price inelastic, and the levy is regressive, falling hardest on lower-income households. Its impact therefore depends mainly on firms' reformulation rather than on the price change.")]}]},
{id:"e3",title:"12-marker: game theory & collusion",m:12,kind:"econ",q:"With reference to the extract and a game theory payoff matrix, discuss why firms in the supermarket industry may choose not to collude. (12 marks)",
items:[{label:"Extract",prov:"Practice extract, written for revision. Figures are illustrative.",text:"Four supermarkets hold about 65% of the UK grocery market. Discounters have grown fast, taking market share with low prices. In 2003 several supermarkets and dairies were fined by the competition authority for coordinating milk prices. Price-matching schemes and loyalty card offers are now common.",
steps:[
M("Structure","What does the question REQUIRE to reach top KAA?",["A payoff matrix with explained numbers, a dominant strategy and a Nash equilibrium","A monopoly diagram","A definition only","An externality diagram"],0,"Examiners cap KAA without the required tool, and criticise matrices whose numbers aren't explained."),
DGQ("game"),
M("Read the matrix","In the matrix, why would Firm A cut its price even if it expects B to keep prices high?",["It earns £14m instead of £10m","It earns £5m instead of £2m","It must by law","It has no choice"],0,"That's the incentive to cheat, the core reason collusion is unstable."),
X("Reasons not to collude","Tick ALL the reasons supported by the extract or context",["Incentive to cheat for a bigger share of profit","Collusion is illegal: the 2003 milk-price fines show the risk","Discounters have grown, so the market is more competitive and harder to coordinate","High concentration (four firms with 65%) makes collusion impossible","Leniency programmes reward whistle-blowers"],[0,1,2,4],"High concentration makes collusion EASIER, so it doesn't support the argument."),
X("Evaluation","Tick ALL the valid evaluation points",["Tacit collusion (e.g. price matching) can achieve similar outcomes without an agreement","Repeated games make cooperation more likely, as firms fear retaliation","The matrix assumes only two firms and one-off decisions, which isn't realistic","Firms never compete on price"],[0,1,2],"'Never compete on price' is contradicted by the discounters in the extract."),
W("Collusion is when firms agree to limit competition, for example by fixing prices. In the matrix, if both firms keep prices high they each earn £10m. But each has a dominant strategy to cut prices: Firm A earns £14m by cutting if B stays high, and £5m rather than £2m if B cuts too. The Nash equilibrium is that both cut, earning £5m each. This shows the incentive to cheat, so collusion is unstable. It is also illegal: the 2003 milk-price fines show the risk. The growth of discounters makes coordination even harder.<br><br><b>Evaluation:</b> the matrix is a simplification. In reality the game is repeated, so firms may avoid price wars for fear of retaliation, and tacit collusion through price-matching can keep prices high without an explicit agreement. With four firms holding 65% of the market, conditions do favour collusion. Whether they collude depends mainly on the strength of competition from discounters and the threat of fines.")]}]},
{id:"e4",title:"15-marker: tradable pollution permits",m:15,kind:"econ",q:"With reference to the extract, evaluate the effectiveness of tradable pollution permits in reducing carbon emissions. (15 marks)",
items:[{label:"Extract",prov:"Practice extract, written for revision. Figures are illustrative.",text:"The EU Emissions Trading System sets a cap on carbon emissions from power and heavy industry. In its early years too many permits were given away free, and the price fell close to zero. After reforms cut the supply of permits, the price rose above €80 per tonne by 2022, and emissions from covered sectors fell by around 35% compared with 2005. Some firms warned they would move production outside the EU.",
steps:[
M("Structure","Best structure for a 15-mark 'evaluate'?",["Two or three developed points (9 KAA), each followed by evaluation (6 EV), and a supported judgement","One sentence per point","Only disadvantages","A diagram and no writing"],0,"Two strong points with evaluation beat three thin ones."),
O("Chain","Order the chain showing how permits reduce emissions",["The government sets a cap on total emissions","and issues permits, each allowing one tonne of CO₂","firms that cut emissions cheaply sell spare permits","firms with high abatement costs buy them","so emissions are cut where it is cheapest, and total emissions cannot exceed the cap"],"Show the market mechanism step by step."),
X("Application","Tick ALL the extract evidence of permits WORKING",["The price rose above €80 per tonne after reforms","Emissions in covered sectors fell around 35% from 2005","The price fell close to zero in the early years","Some firms threatened to relocate"],[0,1],"The near-zero price and relocation are evidence AGAINST, so use them in your evaluation."),
X("Evaluation","Tick ALL the strong evaluation points",["Effectiveness depends on setting the cap correctly: over-allocation made the price collapse (information gaps)","Carbon leakage: production may move outside the EU, so global emissions may not fall","Other factors, such as the switch from coal to renewables, also cut emissions, so the 35% isn't all due to permits","Permits mean pollution can never fall","A carbon tax gives price certainty, while permits give certainty over quantity"],[0,1,2,4],"Permits CAN reduce pollution if the cap is tight, so the fourth option is wrong."),
W("Tradable permits cap total emissions and allow firms to trade allowances. Firms that can cut emissions cheaply sell spare permits to those with high abatement costs, so emissions fall at the lowest cost to society, and the cap guarantees the total. The extract supports this: after reforms the price rose above €80 per tonne and emissions in covered sectors fell about 35% from 2005. The high price also gives firms a dynamic incentive to invest in green technology.<br><br><b>Evaluation:</b> effectiveness depends on setting the cap correctly. In the early years over-allocation drove the price close to zero, a government failure caused by information gaps. Not all of the 35% fall is due to permits, since the shift to renewables also played a part. Carbon leakage may mean global emissions fall less than EU emissions. <b>Judgement:</b> permits are effective when the cap is tight and permits are auctioned, so their success depends more on policy design than on the mechanism itself.")]}]},
{id:"e5",title:"25-marker: monopoly (Q7)",m:25,kind:"econ",q:"Evaluate the view that monopolies are always against the public interest. (25 marks)",
items:[{label:"Plan",prov:"Essay questions have no extract. Bring your own real-world examples.",text:"<b>25-mark structure (about 30 minutes):</b> Intro → KAA 1 + diagram → EV 1 → KAA 2 → EV 2 → Conclusion with a supported judgement.<br><b>Examples to use:</b> water companies (regional natural monopolies, regulated by Ofwat), pharmaceutical patents, Google's dominance of search, Royal Mail.",
steps:[
M("Mark split","How are the 25 marks split?",["16 KAA + 9 EV","25 KAA","12 KAA + 13 EV","20 KAA + 5 EV"],0,"Evaluation must be sustained through the essay to reach the top level, not tacked on at the end."),
DGQ("mono"),
O("Chain: against the public interest","Order the chain",["High barriers to entry protect the monopolist from competition","so it profit-maximises where MC = MR and sets price on the AR curve","so price is above MC (allocative inefficiency) and output is restricted","so consumer surplus falls and there is a deadweight welfare loss","and supernormal profit persists in the long run, so consumers pay more and get less choice"],"Use the diagram at each step."),
X("For the public interest","Tick ALL the valid arguments that monopolies CAN benefit the public",["Economies of scale can lower average costs, so price may be lower than under competition","Supernormal profit can fund R&D, giving dynamic efficiency (e.g. pharmaceuticals)","Natural monopolies avoid wasteful duplication (e.g. water pipes)","Monopolies are always allocatively efficient","Domestic monopolies may compete internationally"],[0,1,2,4],"Profit-maximising monopolies set P > MC, so they are NOT allocatively efficient."),
X("Evaluation","Tick ALL the strong evaluation points",["It depends on contestability: low entry barriers keep a monopolist's prices near competitive levels","Regulation (e.g. RPI–X price caps from Ofwat) can limit abuse, but regulatory capture is possible","Profits may go to shareholders rather than R&D, so dynamic efficiency isn't guaranteed","'Always' is too strong: the effect depends on the type of market and how it is regulated","Monopolies are illegal in the UK"],[0,1,2,3],"Monopoly isn't illegal. Abuse of a dominant position is."),
W("<b>Intro:</b> A pure monopoly is a single seller. A legal monopoly holds over 25% market share. The public interest covers consumers' welfare, efficiency and innovation.<br><br><b>KAA 1 (against):</b> High barriers to entry let the monopolist profit-maximise where MC = MR, setting price Pm on the AR curve. Because P > MC, it is allocatively inefficient, and output is not at minimum AC, so it is productively inefficient too. Consumer surplus falls, there is a deadweight loss, and supernormal profit persists. Water companies, for example, have faced criticism for high bills and under-investment.<br><b>EV 1:</b> The harm depends on contestability and regulation. Ofwat's price caps limit price rises, although regulatory capture and information gaps mean caps may be set too loosely.<br><br><b>KAA 2 (for):</b> Large scale brings economies of scale. In a natural monopoly such as water distribution, one firm avoids duplicating pipe networks, so average costs and prices may be lower than with several firms. Supernormal profit can fund R&D: pharmaceutical patents give temporary monopolies that reward costly drug development, an example of dynamic efficiency.<br><b>EV 2:</b> These benefits only follow if profits are reinvested rather than paid to shareholders, and if cost savings are passed on rather than absorbed by X-inefficiency.<br><br><b>Conclusion:</b> Monopolies are not always against the public interest. Unregulated monopolies with high barriers are likely to harm consumers, but natural monopolies under effective regulation, and innovation-driven monopolies, can benefit the public. The deciding factor is the strength of competition and regulation the monopolist faces.")]}]},
{id:"e6",title:"25-marker: monopsony (Q8)",m:25,kind:"econ",q:"Evaluate the economic effects of monopsony power in labour and product markets. (25 marks)",
items:[{label:"Plan",prov:"Essay questions have no extract. Bring your own real-world examples.",text:"<b>Examples to use:</b> the NHS as the main employer of nurses, supermarkets buying from farmers and dairies, large employers in small towns (e.g. a single warehouse or factory), the Groceries Code Adjudicator.",
steps:[
DGQ("monop"),
O("Chain: labour market","Order the chain",["A monopsony employer faces the upward-sloping supply of labour (ACL)","To hire one more worker it must raise the wage for all workers, so MCL lies above ACL","It hires where MCL = MRP, employing fewer workers than a competitive market (Qm < Qc)","It pays only the wage on the ACL curve at Qm, below the competitive wage","so workers receive less than their MRP: lower wages and lower employment"],"Name each curve as you go."),
X("Benefits","Tick ALL the valid arguments that monopsony CAN have benefits",["Lower input costs may be passed on to consumers as lower prices","The NHS's buying power keeps drug and staffing costs down, which saves taxpayers money","Monopsonists always raise wages","Countervailing power: a monopsony buyer can offset a monopoly seller (bilateral monopoly)"],[0,1,3],"Monopsony lowers wages. That's the standard prediction."),
X("Evaluation","Tick ALL the strong evaluation points",["Trade unions can raise wages and employment towards competitive levels under monopsony","A minimum wage set between Wm and Wc can raise both wages AND employment","Supermarket savings may be kept as profit, not passed on, if they also have selling power","Low prices paid to farmers may cut their investment and quality in the long run","Monopsony only exists in the public sector"],[0,1,2,3],"Private firms, such as supermarkets and large employers, are classic monopsonists."),
M("Judgement","Best conclusion?",["Monopsony is always bad","The overall effect depends on whether cost savings are passed on and on countervailing power (unions, regulators). It harms workers and suppliers most where these are weak.","Monopsony is always good","Monopsony has no effects"],1,"A conditional judgement that names the deciding factor."),
W("<b>Intro:</b> A monopsony is a single or dominant buyer of a product or factor of production, giving it power to set the price it pays.<br><br><b>KAA 1 (labour):</b> A monopsony employer faces an upward-sloping ACL curve. Because hiring an extra worker means raising the wage for everyone, MCL lies above ACL. It hires where MCL = MRP, at Qm, and pays only Wm from the ACL curve. Wages and employment are both below the competitive levels Wc and Qc, so workers are paid less than their MRP. The NHS, as the dominant employer of nurses, is often cited as an example.<br><b>EV 1:</b> Strong unions can push wages towards Wc. A minimum wage set between Wm and Wc can raise wages and employment at the same time, unlike in a competitive market.<br><br><b>KAA 2 (products):</b> Supermarkets use their buying power to cut the prices paid to farmers and dairies. Lower costs can be passed on to consumers as lower prices, and the NHS's buying power reduces costs for taxpayers.<br><b>EV 2:</b> The savings may be kept as supernormal profit if supermarkets also have selling power. Squeezed suppliers may cut investment and quality or leave the industry, reducing choice in the long run. The Groceries Code Adjudicator exists to limit this.<br><br><b>Conclusion:</b> Monopsony transfers welfare from workers and suppliers to the buyer. Whether society gains overall depends on whether savings reach consumers or taxpayers, and on countervailing power from unions and regulators.")]}]}
];
function DGQ(k){const q={tax:["Diagram check","On a correct indirect tax diagram, which is TRUE?",["Supply shifts vertically up by the tax, price rises by less than the tax, and the tax rectangle is split between consumers and producers","Demand shifts left by the tax","Price rises by exactly the tax in every case","The tax shifts supply right"],0],
game:["Diagram check","In this payoff matrix, what is the Nash equilibrium?",["Both choose a low price (£5m each)","Both choose a high price (£10m each)","A high, B low","There is none"],0],
mono:["Diagram check","On a monopoly diagram, how is supernormal profit shown?",["(AR – AC) × Q at the output where MC = MR","Where AR = AC","The area under MC","(MR – MC) × Q"],0],
monop:["Diagram check","On a monopsony labour market diagram, what wage is paid?",["The wage on the ACL (supply) curve at the output where MCL = MRP","The wage where MCL = MRP","The competitive wage where ACL = MRP","The minimum wage"],0]}[k];
return {k:"mcq",h:q[0],q:DG[k].replace(/<p class="hint">[\s\S]*?<\/p>/,"")+'<div style="margin-top:8px">'+q[1]+"</div>",o:q[2],a:q[3],e:"Practise drawing it yourself: label the axes, curves, equilibria and shaded areas, then check it against this."}}

/* ---------- MATHS CRASH COURSE ---------- */
const CC=[
{id:"y1c1",y:1,n:1,t:"Algebraic expressions",key:["Index laws: a<sup>m</sup>×a<sup>n</sup>=a<sup>m+n</sup>, a<sup>m</sup>÷a<sup>n</sup>=a<sup>m–n</sup>, (a<sup>m</sup>)<sup>n</sup>=a<sup>mn</sup>","a<sup>–n</sup>=1/a<sup>n</sup>, a<sup>1/n</sup>=ⁿ√a, a<sup>m/n</sup>=(ⁿ√a)<sup>m</sup>, a<sup>0</sup>=1","Surds: √(ab)=√a√b, √(a/b)=√a/√b. Simplify by pulling out square factors: √12=2√3","Rationalise: 1/√a = √a/a. For 1/(a+√b), multiply top and bottom by the conjugate (a–√b)"],
ex:[{q:"Simplify (8x<sup>6</sup>)<sup>2/3</sup>",s:["Apply the power to each part: 8<sup>2/3</sup> × (x<sup>6</sup>)<sup>2/3</sup>","8<sup>2/3</sup> = (∛8)² = 2² = 4","(x<sup>6</sup>)<sup>2/3</sup> = x<sup>4</sup>","= <b>4x<sup>4</sup></b>"]},
{q:"Rationalise 3/(2 – √3)",s:["Multiply by (2 + √3)/(2 + √3)","Denominator: (2 – √3)(2 + √3) = 4 – 3 = 1","Numerator: 3(2 + √3) = 6 + 3√3","= <b>6 + 3√3</b>"]}],
tr:[{q:"Evaluate 27<sup>–2/3</sup>",ans:1/9,tol:0.001,sol:["27<sup>1/3</sup> = 3, so 27<sup>2/3</sup> = 9","Negative power means reciprocal: <b>1/9</b>"]},{q:"√12 + √27 = k√3. Find k.",ans:5,sol:["√12 = 2√3, √27 = 3√3","Sum = 5√3, so <b>k = 5</b>"]}],
trap:["(a+b)² ≠ a² + b²","√(a+b) ≠ √a + √b","Fractional index: root first, then power, to keep numbers small"]},
{id:"y1c2",y:1,n:2,t:"Quadratics",key:["Solve by factorising, the formula x = (–b ± √(b²–4ac))/2a, or completing the square","Completing the square: x² + bx + c = (x + b/2)² – (b/2)² + c. If a ≠ 1, factor a out first","Turning point of a(x+p)² + q is (–p, q): a minimum if a > 0, a maximum if a < 0","Discriminant b² – 4ac: >0 two real roots, =0 one repeated root, <0 no real roots"],
ex:[{q:"Solve x² – 6x + 4 = 0 by completing the square (exact answers)",s:["x² – 6x = (x – 3)² – 9","(x – 3)² – 9 + 4 = 0, so (x – 3)² = 5","x – 3 = ±√5","<b>x = 3 ± √5</b>"]},
{q:"kx² + 4x + k = 0 has two distinct real roots. Find the range of k.",s:["Two distinct roots: b² – 4ac > 0","16 – 4k² > 0, so k² < 4","<b>–2 < k < 2</b> (and k ≠ 0, otherwise it isn't a quadratic)"]}],
tr:[{q:"x² + kx + 16 = 0 has equal roots and k > 0. Find k.",ans:8,sol:["k² – 64 = 0","<b>k = 8</b>"]},{q:"Find the minimum value of y = 2x² – 8x + 3.",ans:-5,sol:["2(x² – 4x) + 3 = 2[(x – 2)² – 4] + 3","= 2(x – 2)² – 5, so the minimum is <b>–5</b> (at x = 2)"]}],
trap:["When completing the square with a ≠ 1, multiply the –(b/2)² term by a too","Discriminant questions: say which inequality you need (>, ≥ or =) before solving"]},
{id:"y1c3",y:1,n:3,t:"Equations & inequalities",key:["Linear + quadratic simultaneous: rearrange the linear one, substitute into the quadratic, solve, then find the matching values","Linear inequalities: solve like equations, but flip the sign when you multiply or divide by a negative","Quadratic inequalities: find the critical values, sketch the parabola, read off the region","Regions: dotted line for < or >, solid line for ≤ or ≥"],
ex:[{q:"Solve y = x + 1 and x² + y² = 13",s:["Substitute: x² + (x + 1)² = 13","2x² + 2x – 12 = 0, so x² + x – 6 = 0","(x + 3)(x – 2) = 0, so x = 2 or x = –3","<b>(2, 3) and (–3, –2)</b>"]},
{q:"Solve x² – 5x + 4 < 0",s:["Critical values: (x – 1)(x – 4) = 0, so x = 1, 4","Positive parabola, so it's below the x-axis between the roots","<b>1 < x < 4</b>"]}],
tr:[{q:"x² – 2x – 15 > 0. Give the upper critical value.",ans:5,sol:["(x – 5)(x + 3) > 0","Critical values –3 and 5, so the solution is x < –3 or x > 5. Upper critical value: <b>5</b>"]},{q:"Find the smallest integer x satisfying 3x – 5 > 2x + 1",ans:7,sol:["x > 6","The smallest integer is <b>7</b>"]}],
trap:["Never divide both sides by x: you could lose solutions or flip a sign wrongly","'x < –3 or x > 5' is two separate regions. Don't write –3 > x > 5"]},
{id:"y1c4",y:1,n:4,t:"Graphs & transformations",key:["Cubic y = (x–a)(x–b)(x–c): roots cross the axis. A repeated root (x–a)² touches it","Reciprocal y = k/x: asymptotes at x = 0 and y = 0","y = f(x) + a: up a · y = f(x + a): LEFT a","y = af(x): vertical stretch ×a · y = f(ax): horizontal stretch ×1/a","y = –f(x): reflect in the x-axis · y = f(–x): reflect in the y-axis"],
ex:[{q:"Sketch y = (x – 1)²(x + 2)",s:["Positive cubic: bottom-left to top-right","Roots: x = –2 (crosses), x = 1 (repeated, so it touches)","y-intercept: (0 – 1)²(0 + 2) = 2","Sketch through (–2, 0), up to a max, down to touch (1, 0), then up"]},
{q:"y = f(x) has a maximum at (2, 5). Find the maximum of y = f(x – 3) + 1, y = 2f(x) and y = f(2x).",s:["f(x – 3) + 1: right 3, up 1, giving (5, 6)","2f(x): y × 2, giving (2, 10)","f(2x): x ÷ 2, giving (1, 5)"]}],
tr:[{q:"y = f(x) passes through (4, –2). Find the y-coordinate of the corresponding point on y = 3f(x + 1).",ans:-6,sol:["x + 1 moves it left 1: x = 3","3f multiplies y by 3: <b>–6</b>"]},{q:"How many times do y = x² and y = 1/x intersect?",ans:1,sol:["For x > 0 they cross once (at (1, 1)). For x < 0, x² > 0 > 1/x","<b>1</b>"]}],
trap:["f(x + a) moves LEFT, not right","f(2x) halves x-coordinates rather than doubling them"]},
{id:"y1c5",y:1,n:5,t:"Straight line graphs",key:["Gradient m = (y₂ – y₁)/(x₂ – x₁)","y – y₁ = m(x – x₁) for a line through (x₁, y₁)","Parallel: same gradient · Perpendicular: m₁m₂ = –1","Distance = √((x₂–x₁)² + (y₂–y₁)²). Midpoint = average of the coordinates","ax + by + c = 0 form: integers, a usually positive"],
ex:[{q:"Find the line through (2, 3) perpendicular to 2x + 4y = 7",s:["Rearrange: y = –½x + 7/4, so m = –½","Perpendicular gradient = 2","y – 3 = 2(x – 2)","<b>y = 2x – 1</b>"]},
{q:"Find the distance between (1, 2) and (7, 10)",s:["Δx = 6, Δy = 8","√(36 + 64) = <b>10</b>"]}],
tr:[{q:"Find the gradient of 3x – 2y + 6 = 0",ans:1.5,sol:["2y = 3x + 6, so y = 1.5x + 3","<b>m = 1.5</b>"]},{q:"Find the x-intercept of y = 2x – 1",ans:0.5,sol:["0 = 2x – 1","<b>x = 0.5</b>"]}],
trap:["Rearrange to y = mx + c before reading off the gradient","Perpendicular gradient: flip AND change the sign"]},
{id:"y1c6",y:1,n:6,t:"Circles",key:["(x – a)² + (y – b)² = r²: centre (a, b), radius r","From x² + y² + 2fx + 2gy + c = 0, complete the square twice","Tangent ⟂ radius · the perpendicular bisector of a chord passes through the centre · the angle in a semicircle is 90°","Line meets circle: substitute, then the discriminant tells you 2 points, tangent, or no intersection"],
ex:[{q:"Find the centre and radius of x² + y² – 6x + 4y – 12 = 0",s:["(x – 3)² – 9 + (y + 2)² – 4 – 12 = 0","(x – 3)² + (y + 2)² = 25","<b>Centre (3, –2), radius 5</b>"]},
{q:"Find k so that y = x + k is a tangent to x² + y² = 8",s:["x² + (x + k)² = 8, so 2x² + 2kx + k² – 8 = 0","Tangent: b² – 4ac = 0, so 4k² – 8(k² – 8) = 0","–4k² + 64 = 0","<b>k = ±4</b>"]}],
tr:[{q:"Find the radius of x² + y² + 8x – 2y = 8",ans:5,sol:["(x + 4)² + (y – 1)² = 8 + 16 + 1 = 25","<b>r = 5</b>"]},{q:"Find the x-coordinate of the midpoint of (–2, 5) and (6, 1)",ans:2,sol:["(–2 + 6)/2 = <b>2</b>"]}],
trap:["The right-hand side is r², not r","Sign flip: (x + 4)² means the centre is at x = –4"]},
{id:"y1c7",y:1,n:7,t:"Algebraic methods",key:["Simplify algebraic fractions by factorising and cancelling common factors","Polynomial division: x³ ÷ (x – a) by long division or by comparing coefficients","Factor theorem: f(a) = 0 ⇔ (x – a) is a factor","Proof: deduction (show it is true in general), exhaustion (check every case), counter-example (one case disproves it)"],
ex:[{q:"Fully factorise f(x) = x³ – 4x² + x + 6",s:["Try x = –1: –1 – 4 – 1 + 6 = 0, so (x + 1) is a factor","Divide: x³ – 4x² + x + 6 = (x + 1)(x² – 5x + 6)","<b>= (x + 1)(x – 2)(x – 3)</b>"]},
{q:"Prove that (n + 1)² – (n – 1)² is a multiple of 4 for all integers n",s:["Expand: (n² + 2n + 1) – (n² – 2n + 1)","= 4n","4n is 4 × an integer, so it is a multiple of 4 ∎"]}],
tr:[{q:"(x – 2) is a factor of 2x³ + kx² – 5x + 2. Find k.",ans:-2,sol:["f(2) = 16 + 4k – 10 + 2 = 0","4k = –8, so <b>k = –2</b>"]},{q:"x³ – 7x – 6 = (x + 1)(x² + ax + b). Find a.",ans:-1,sol:["Compare coefficients: x² terms give 0 = 1 + a","<b>a = –1</b> (and b = –6)"]}],
trap:["Proof: end with a concluding statement, e.g. 'so it is a multiple of 4'","Factor theorem uses f(a) for (x – a), so (x + 1) means test f(–1)"]},
{id:"y1c8",y:1,n:8,t:"Binomial expansion",key:["(a + b)<sup>n</sup> = aⁿ + ⁿC₁aⁿ⁻¹b + ⁿC₂aⁿ⁻²b² + … + bⁿ","ⁿCᵣ = n!/(r!(n–r)!). Pascal's triangle works for small n","The term in xʳ in (a + bx)ⁿ is ⁿCᵣ aⁿ⁻ʳ (bx)ʳ","Approximations: substitute a small x to estimate a power, e.g. 1.02⁸"],
ex:[{q:"Find the coefficient of x³ in (2 – x)<sup>6</sup>",s:["Term: ⁶C₃ · 2³ · (–x)³","= 20 · 8 · (–1)x³","<b>–160</b>"]},
{q:"Expand (1 + 2x)<sup>8</sup> up to x², then estimate 1.02<sup>8</sup>",s:["1 + 8(2x) + 28(2x)² = 1 + 16x + 112x²","1.02 = 1 + 2x, so x = 0.01","1 + 0.16 + 0.0112 = <b>1.1712</b>"]}],
tr:[{q:"Find the coefficient of x² in (3 + x)<sup>5</sup>",ans:270,sol:["⁵C₂ · 3³ = 10 · 27 = <b>270</b>"]},{q:"Evaluate ⁷C₃",ans:35,sol:["7!/(3!4!) = <b>35</b>"]}],
trap:["Bracket the whole term: (2x)² = 4x², not 2x²","Keep negative signs: (–x)³ = –x³"]},
{id:"y1c9",y:1,n:9,t:"Trigonometric ratios",key:["Sine rule: a/sin A = b/sin B. Use it with an opposite pair","Cosine rule: a² = b² + c² – 2bc cos A. Use it for SAS or SSS","Area = ½ab sin C","Ambiguous case: if you find an angle with the sine rule, 180° – θ may also work","Graphs: sin and cos have period 360°, tan has period 180° with asymptotes at 90°, 270°"],
ex:[{q:"A triangle has sides 7, 8 and 9. Find the angle opposite 9.",s:["cos C = (7² + 8² – 9²)/(2·7·8)","= 32/112 = 0.2857","<b>C = 73.4°</b>"]},
{q:"Find the area of a triangle with a = 5, b = 6, C = 30°",s:["½ · 5 · 6 · sin 30°","= 15 · 0.5 = <b>7.5</b>"]}],
tr:[{q:"b = 10, A = 40°, B = 65°. Find a (2 d.p.).",ans:7.09,tol:0.01,sol:["a = 10 sin 40° / sin 65°","= 6.428 / 0.9063 = <b>7.09</b>"]},{q:"Find the area with a = 8, b = 5, C = 120° (2 d.p.)",ans:17.32,tol:0.01,sol:["½ · 8 · 5 · sin 120° = 20 · 0.866 = <b>17.32</b>"]}],
trap:["Calculator in DEGREES for this chapter","Check the ambiguous case whenever you find an angle with the sine rule"]},
{id:"y1c10",y:1,n:10,t:"Trig identities & equations",key:["sin²θ + cos²θ = 1 · tan θ = sin θ / cos θ","Unit circle and CAST: where each ratio is positive","sin θ = k gives θ and 180° – θ · cos θ = k gives θ and 360° – θ · tan θ = k gives θ and θ + 180°","For sin(2x) = k, solve for 2x over a doubled interval, then halve","Quadratics in sin/cos: factorise, then solve each factor"],
ex:[{q:"Solve 2sin²x – sin x – 1 = 0, 0° ≤ x < 360°",s:["(2sin x + 1)(sin x – 1) = 0","sin x = 1 gives x = 90°","sin x = –½ gives x = 210°, 330°","<b>x = 90°, 210°, 330°</b>"]},
{q:"Solve tan 2x = √3, 0° ≤ x < 180°",s:["Interval for 2x: 0° ≤ 2x < 360°","2x = 60°, 240°","<b>x = 30°, 120°</b>"]}],
tr:[{q:"Find the smallest solution of cos x = –0.5 in 0° ≤ x < 360°",ans:120,sol:["cos⁻¹(–0.5) = <b>120°</b> (the other is 240°)"]},{q:"sin(x + 30°) = 0.5, 0° ≤ x < 360°. Give the non-zero solution.",ans:120,sol:["x + 30° = 30° or 150° (in 30° to 390°)","x = 0° or <b>120°</b>"]}],
trap:["Don't divide by sin x or cos x: factorise instead, or you lose solutions","Adjust the interval BEFORE solving for kx or x + a"]},
{id:"y1c11",y:1,n:11,t:"Vectors",key:["|ai + bj| = √(a² + b²) · unit vector = a/|a|","Direction: angle with i = tan⁻¹(b/a) (draw it!)","AB = b – a (position vectors)","Parallel: one is a scalar multiple of the other","Geometric problems: write a route two ways and compare coefficients"],
ex:[{q:"a = 3i – 4j. Find |a|, the unit vector and the angle with i",s:["|a| = √(9 + 16) = 5","Unit vector = (3i – 4j)/5","tan⁻¹(4/3) = 53.1°, below the i direction"]},
{q:"A(1, 2), B(7, –6). Find AB and its length",s:["AB = (7 – 1)i + (–6 – 2)j = 6i – 8j","|AB| = √(36 + 64) = <b>10</b>"]}],
tr:[{q:"Find |5i + 12j|",ans:13,sol:["√(25 + 144) = <b>13</b>"]},{q:"2i + kj is parallel to 6i – 9j. Find k.",ans:-3,sol:["6i – 9j = 3(2i – 3j)","<b>k = –3</b>"]}],
trap:["AB = b – a, NOT a – b","Bearings and angles: always sketch"]},
{id:"y1c12",y:1,n:12,t:"Differentiation",key:["First principles: f'(x) = lim<sub>h→0</sub> (f(x+h) – f(x))/h","d/dx(xⁿ) = nxⁿ⁻¹. Rewrite roots and fractions as powers first","Tangent: y – y₁ = m(x – x₁) · Normal gradient = –1/m","Increasing: f'(x) > 0 · Decreasing: f'(x) < 0","Stationary: f'(x) = 0. f'' > 0 minimum, f'' < 0 maximum"],
ex:[{q:"Differentiate x² from first principles",s:["((x + h)² – x²)/h = (2xh + h²)/h","= 2x + h","As h → 0, the limit is <b>2x</b>"]},
{q:"Find and classify the stationary points of y = x³ – 3x² – 9x + 2",s:["dy/dx = 3x² – 6x – 9 = 3(x – 3)(x + 1) = 0","x = 3: y = –25 · x = –1: y = 7","d²y/dx² = 6x – 6. At x = 3 it's 12 > 0, a min. At x = –1 it's –12 < 0, a max","<b>Min (3, –25), Max (–1, 7)</b>"]}],
tr:[{q:"Find the gradient of y = 4√x at x = 9 (3 d.p.)",ans:0.667,tol:0.002,sol:["y = 4x<sup>½</sup>, so dy/dx = 2x<sup>–½</sup>","At x = 9: 2/3 = <b>0.667</b>"]},{q:"Find the gradient of the normal to y = x² at x = 2",ans:-0.25,tol:0.001,sol:["Tangent gradient = 2x = 4","Normal gradient = <b>–1/4</b>"]}],
trap:["Simplify to powers of x before differentiating, e.g. 3/x² = 3x⁻²","Find the y-coordinate from the ORIGINAL equation, not the derivative"]},
{id:"y1c13",y:1,n:13,t:"Integration",key:["∫xⁿ dx = xⁿ⁺¹/(n+1) + c (n ≠ –1)","Find c from a given point","Definite integral: [F(x)] from a to b = F(b) – F(a)","Area below the x-axis is negative: integrate each section separately and add the sizes","Area between curve and line: ∫(top – bottom) dx"],
ex:[{q:"Find ∫(6x² + 2/x³) dx",s:["Rewrite: 6x² + 2x⁻³","= 2x³ + 2x⁻²/(–2)","= <b>2x³ – x⁻² + c</b>"]},
{q:"Find the area enclosed by y = x(4 – x) and the x-axis",s:["Roots: x = 0, 4","∫₀⁴ (4x – x²) dx = [2x² – x³/3]₀⁴","= 32 – 64/3 = <b>32/3</b>"]}],
tr:[{q:"Evaluate ∫₁⁴ 3√x dx",ans:14,sol:["∫3x<sup>½</sup> dx = 2x<sup>3/2</sup>","[2x<sup>3/2</sup>]₁⁴ = 16 – 2 = <b>14</b>"]},{q:"f'(x) = 6x – 2 and f(1) = 5. Find f(2).",ans:12,sol:["f(x) = 3x² – 2x + c, and 3 – 2 + c = 5 gives c = 4","f(2) = 12 – 4 + 4 = <b>12</b>"]}],
trap:["Don't forget + c on indefinite integrals","Sketch first so you spot any area below the axis"]},
{id:"y1c14",y:1,n:14,t:"Exponentials & logarithms",key:["d/dx(e<sup>kx</sup>) = ke<sup>kx</sup> · y = eˣ and y = ln x are reflections in y = x","log laws: log ab = log a + log b · log(a/b) = log a – log b · log aⁿ = n log a","aˣ = b gives x = ln b / ln a","y = axⁿ → log y = log a + n log x (straight line) · y = abˣ → log y = log a + x log b","Models: P = Aeᵏᵗ. Interpret A (initial value) and k (growth rate)"],
ex:[{q:"Solve 5ˣ = 12 (3 d.p.)",s:["x = ln 12 / ln 5","= <b>1.544</b>"]},
{q:"Solve log₂(x + 3) + log₂(x – 3) = 4",s:["log₂((x + 3)(x – 3)) = 4","x² – 9 = 16, so x = ±5","x = –5 makes a log argument negative, so reject it","<b>x = 5</b>"]}],
tr:[{q:"Solve e<sup>2x</sup> = 7 (3 d.p.)",ans:0.973,tol:0.001,sol:["2x = ln 7","x = <b>0.973</b>"]},{q:"Evaluate log₃ 81",ans:4,sol:["3⁴ = 81, so <b>4</b>"]}],
trap:["log(a + b) ≠ log a + log b","Always check solutions in the original log equation"]},
{id:"y2c1",y:2,n:1,t:"Algebraic methods",key:["Proof by contradiction: assume the opposite, reach something impossible (e.g. √2 irrational, infinitely many primes)","Partial fractions: A/(x+a) + B/(x+b). Substitute the roots to find A and B","Repeated factor: A/(x+a) + B/(x+b) + C/(x+b)²","Improper fraction (top degree ≥ bottom): divide first"],
ex:[{q:"Express (3x + 5)/((x + 1)(x + 3)) in partial fractions",s:["3x + 5 = A(x + 3) + B(x + 1)","x = –1: 2 = 2A, so A = 1","x = –3: –4 = –2B, so B = 2","<b>1/(x + 1) + 2/(x + 3)</b>"]},
{q:"Express (x + 5)/((x – 1)(x + 1)²) in partial fractions",s:["x + 5 = A(x + 1)² + B(x – 1)(x + 1) + C(x – 1)","x = 1: 6 = 4A, so A = 3/2","x = –1: 4 = –2C, so C = –2","Compare x²: 0 = A + B, so B = –3/2","<b>3/(2(x – 1)) – 3/(2(x + 1)) – 2/(x + 1)²</b>"]}],
tr:[{q:"1/(x(x + 2)) = A/x + B/(x + 2). Find A.",ans:0.5,sol:["1 = A(x + 2) + Bx","x = 0: A = <b>1/2</b>"]},{q:"(x² + 3x + 5)/(x + 1) = x + a + b/(x + 1). Find b.",ans:3,sol:["x² + 3x + 5 = (x + 1)(x + 2) + 3","<b>b = 3</b> (a = 2)"]}],
trap:["Repeated factors need ALL powers up to the repeated one","Contradiction proofs must state the assumption clearly at the start"]},
{id:"y2c2",y:2,n:2,t:"Functions & graphs",key:["|x| = x for x ≥ 0, –x for x < 0. Solve |f(x)| = g(x) using both cases, then check","Function: one output per input. Domain = inputs, range = outputs","fg(x) = f(g(x)): apply g first","Inverse: swap x and y, rearrange. Domain of f⁻¹ = range of f. Graph reflected in y = x","y = |f(x)|: reflect the negative part up · y = f(|x|): reflect the right-hand side into the left"],
ex:[{q:"f(x) = 2x + 1, g(x) = x². Find fg(3), gf(3) and f⁻¹(x).",s:["fg(3) = f(9) = 19","gf(3) = g(7) = 49","y = 2x + 1, so x = (y – 1)/2","<b>f⁻¹(x) = (x – 1)/2</b>"]},
{q:"Solve |2x – 3| = x",s:["Case 1: 2x – 3 = x gives x = 3","Case 2: –(2x – 3) = x gives x = 1","Both make the RHS ≥ 0, so <b>x = 1, 3</b>"]}],
tr:[{q:"f(x) = 3x – 4. Find f⁻¹(5).",ans:3,sol:["Solve 3x – 4 = 5","<b>x = 3</b>"]},{q:"Solve |x – 2| = 3x",ans:0.5,sol:["x – 2 = 3x gives x = –1, but then 3x < 0, so reject","–(x – 2) = 3x gives <b>x = 0.5</b>"]}],
trap:["Always check modulus solutions in the original equation","fg means g FIRST"]},
{id:"y2c3",y:2,n:3,t:"Sequences & series",key:["Arithmetic: uₙ = a + (n–1)d, Sₙ = n/2(2a + (n–1)d)","Geometric: uₙ = arⁿ⁻¹, Sₙ = a(1–rⁿ)/(1–r), S∞ = a/(1–r) when |r| < 1","Σ notation: Σ(3r + 2) = 3Σr + Σ2","Recurrence: uₙ₊₁ = f(uₙ). Sequences can be increasing, decreasing or periodic"],
ex:[{q:"A geometric sequence has u₂ = 12 and u₅ = –96. Find r, a and S₁₀.",s:["ar⁴/ar = r³ = –8, so r = –2","a = 12/(–2) = –6","S₁₀ = –6(1 – 1024)/(1 – (–2)) = –6(–1023)/3","<b>S₁₀ = 2046</b>"]},
{q:"Evaluate Σ from r = 1 to 20 of (3r + 2)",s:["Arithmetic: first term 5, last term 62, 20 terms","20/2 · (5 + 62) = <b>670</b>"]}],
tr:[{q:"Find S∞ for 27 + 9 + 3 + …",ans:40.5,sol:["r = 1/3","27/(2/3) = <b>40.5</b>"]},{q:"uₙ₊₁ = 2uₙ – 1, u₁ = 3. Find u₄.",ans:17,sol:["u₂ = 5, u₃ = 9","<b>u₄ = 17</b>"]}],
trap:["S∞ only exists if |r| < 1. Say so in your answer","Count terms carefully: from r = 1 to 20 is 20 terms"]},
{id:"y2c4",y:2,n:4,t:"Binomial expansion",key:["(1 + x)ⁿ = 1 + nx + n(n–1)x²/2! + n(n–1)(n–2)x³/3! + … for any rational n","Valid for |x| < 1 when n is negative or a fraction","(a + bx)ⁿ = aⁿ(1 + bx/a)ⁿ, valid for |x| < |a/b|","Combine with partial fractions to expand harder expressions"],
ex:[{q:"Expand (4 + x)<sup>½</sup> up to x² and state the validity",s:["= 2(1 + x/4)<sup>½</sup>","(1 + u)<sup>½</sup> = 1 + u/2 – u²/8 with u = x/4","= 2(1 + x/8 – x²/128)","<b>2 + x/4 – x²/64</b>, valid for |x| < 4"]},
{q:"Expand (1 – 2x)<sup>–2</sup> up to x²",s:["1 + (–2)(–2x) + (–2)(–3)/2 · (–2x)²","= 1 + 4x + 3 · 4x²","<b>1 + 4x + 12x²</b>, valid for |x| < ½"]}],
tr:[{q:"Find the coefficient of x² in (1 + 3x)<sup>–1</sup>",ans:9,sol:["(–1)(–2)/2 · (3x)² = 9x²","<b>9</b>"]},{q:"(2 – x)<sup>–3</sup> is valid for |x| < k. Find k.",ans:2,sol:["= 2⁻³(1 – x/2)⁻³","|x/2| < 1, so <b>k = 2</b>"]}],
trap:["Take out aⁿ, not a","(–2x)² = 4x², so the signs matter"]},
{id:"y2c5",y:2,n:5,t:"Radians",key:["π rad = 180°","Arc length s = rθ · Sector area = ½r²θ · Segment = ½r²(θ – sin θ)","Small angles (radians): sin θ ≈ θ, tan θ ≈ θ, cos θ ≈ 1 – θ²/2","Exact values: π/6, π/4, π/3"],
ex:[{q:"A sector has r = 6 and θ = 0.8 rad. Find the arc length and area.",s:["s = 6 × 0.8 = <b>4.8</b>","A = ½ × 36 × 0.8 = <b>14.4</b>"]},
{q:"Find an approximation for (1 – cos 2θ)/(θ sin θ) when θ is small",s:["cos 2θ ≈ 1 – (2θ)²/2 = 1 – 2θ²","Top ≈ 2θ², bottom ≈ θ · θ = θ²","≈ <b>2</b>"]}],
tr:[{q:"135° = kπ radians. Find k.",ans:0.75,sol:["135/180 = <b>0.75</b>"]},{q:"Find the segment area with r = 4, θ = π/3 (2 d.p.)",ans:1.45,tol:0.01,sol:["½ · 16 · (π/3 – sin π/3)","= 8(1.0472 – 0.8660) = <b>1.45</b>"]}],
trap:["Calculator in RADIANS for this chapter onwards","Small angle: replace cos 2θ using (2θ)², not 2θ²"]},
{id:"y2c6",y:2,n:6,t:"Trigonometric functions",key:["sec θ = 1/cos θ · cosec θ = 1/sin θ · cot θ = 1/tan θ","1 + tan²θ = sec²θ · 1 + cot²θ = cosec²θ","arcsin: [–π/2, π/2] · arccos: [0, π] · arctan: (–π/2, π/2)","Graphs: sec has asymptotes where cos = 0, etc."],

      <div class="btns">${AI?`<button class="btn" id="kmark" onclick="kMark()">🧑‍🏫 Mark my paragraph</button>`:""}<button class="btn ghost" onclick="K.showModel=!K.showModel;renderK()">${K.showModel?"Hide":"Show"} model ${s.kind==="econ"?"answer":"paragraph"}</button></div><div id="kmk"></div>
      ${K.showModel?`<div class="model"><b>Model ${s.kind==="econ"?"answer":"paragraph"}</b><br>${st.model}${s.kind==="econ"?'<p class="hint" style="margin:8px 0 0">Written for practice, in line with Edexcel mark-scheme structure. Not an official exemplar.</p>':""}</div>`:""}
      <div class="btns">${s.kind==="econ"?`<button class="btn ghost" onclick="K=null;skillsList();scrollTo(0,0)">Back to sets</button>`:K.item+1<s.items.length?`<button class="btn" onclick="K.item++;K.step=0;K.sel=[];K.showModel=false;renderK();scrollTo(0,0)">Next: ${s.items[K.item+1].label} →</button>`:`<button class="btn" onclick="K.item=${s.items.length};renderK();scrollTo(0,0)">Full answer →</button>`}</div>`}
    html+=`</div>`;
  });
  const st=it.steps[K.step];if(st&&R[K.step]!==undefined&&st.k!=="write")html+=`<div class="btns"><button class="btn" onclick="K.step++;K.sel=[];renderK();setTimeout(()=>{const c=document.querySelectorAll('.stepc');c[c.length-1].scrollIntoView({behavior:'smooth',block:'start'})},30)">Next step →</button></div>`;
  $("app").innerHTML=head+tabs+html;
}
function kOrd(k,j){const a=K.os[k]||(K.os[k]=[]),p=a.indexOf(j);p>=0?a.splice(p,1):a.push(j);renderK()}
function kOrdCheck(i,k){const pick=K.os[k].slice(),ok=pick.every((v,n)=>v===n);K.res[K.item][i]={pick,ok};K.max++;if(ok)K.score++;renderK();kCheckEnd()}
function kMcq(i,j){const st=K.s.items[K.item].steps[i],ok=j===st.a;K.res[K.item][i]={pick:j,ok};K.max++;if(ok)K.score++;renderK();kCheckEnd()}
function kTog(j){const k=K.sel.indexOf(j);k<0?K.sel.push(j):K.sel.splice(k,1);renderK()}
function kMulti(i){const st=K.s.items[K.item].steps[i],pick=K.sel.slice(),ok=pick.length===st.c.length&&st.c.every(c=>pick.includes(c));K.res[K.item][i]={pick,ok};K.max++;if(ok)K.score++;K.sel=[];renderK();kCheckEnd()}
function kCheckEnd(){const s=K.s,allDone=s.items.every((it,ii)=>it.steps.every((st,si)=>st.k==="write"||(K.res[ii]&&K.res[ii][si]!==undefined)));if(allDone&&!K.saved){K.saved=true;kSave()}}
function fullAnswer(){
  const s=K.s,key=s.id+":full",pct=K.max?Math.round(K.score/K.max*100):null;
  return`<div class="card">${pct!==null?`<div class="meta"><span class="pill m">Skill checks: ${K.score}/${K.max}</span></div>`:""}<div class="q">Write the full answer</div>
  <p class="hint">${s.kind==="interp"?"AQA Q1: treat each extract in turn (no need to compare them). For each one: argument, support, challenge, and how convincing it is. About 45–60 minutes.":"AQA Q1: assess each source's value for the enquiry: provenance, tone and emphasis, content against context. No overall comparison is needed. About 60 minutes."}</p>
  <textarea id="kfull" style="min-height:220px" oninput="DRAFT['${key}']=this.value" placeholder="Your full answer…">${esc(DRAFT[key]||"")}</textarea>
  <div class="btns">${AI?`<button class="btn" id="kfm" onclick="kMarkFull()">🧑‍🏫 Mark my full answer (/${s.m})</button>`:""}<button class="btn ghost" onclick="K=null;skillsList()">Back to sets</button></div><div id="kfmk"></div></div>`;
}
async function aiMark(prompt,out,btn,label){
  if(!AI)return null;btn.disabled=true;btn.textContent="Marking…";out.innerHTML='<div class="ai">Reading…</div>';let r=null;
  try{r=await AI(prompt,{modelTier:"default",onText:({text})=>{out.innerHTML='<div class="ai">'+md(text)+'</div>'}})}
  catch(e){out.innerHTML='<div class="ai">'+(e&&e.code==="rate_limited"?"Claude's busy. Try again in a minute.":"Couldn't reach Claude just now.")+'</div>';if(e&&e.code==="not_granted")AI=null}
  btn.disabled=false;btn.textContent=label;return r;
}
function kMark(){
  const s=K.s,it=s.items[K.item],txt=($("kans").value||"").trim(),out=$("kmk");
  if(txt.length<40){out.innerHTML='<div class="ai">Write a fuller answer first.</div>';return}
  const model=it.steps.find(x=>x.k==="write").model;
  if(s.kind==="econ"){aiMark(`You are an experienced Pearson Edexcel A-level Economics A examiner.
Question${s.m?" ("+s.m+" marks)":""}: ${strip(s.q)}
${it.prov?"Extract ("+strip(it.prov)+"): "+strip(it.text):""}
Model answer for reference: "${strip(model)}"
Student answer: """${txt.slice(0,7000)}"""
Mark using Edexcel's split${s.m?(s.m===25?" (16 KAA + 9 EV)":s.m===15?" (9 KAA + 6 EV)":s.m===12?" (8 KAA + 4 EV)":s.m===10?" (6 KAA + 4 EV)":" (6 KAA + 2 EV)"):""}. Reward definitions, application to the extract or real examples, logical step-by-step chains of reasoning, diagrams described accurately, and sustained evaluation with a supported judgement. Penalise generic points, unexplained 'however', and summaries posing as evaluation. Reply in UK English, under 230 words:
${s.m?"**Estimated mark: X/"+s.m+"** (KAA a/b, EV c/d)":"**Verdict:** one line"}
**What's good**
- 2 bullets
**To push it higher**
- 3 specific bullets referring to their answer
**Upgrade** rewrite their weakest sentence or chain better.`,out,$("kmark"),"🧑‍🏫 Mark again").then(r=>{const m=r&&/Estimated mark:\s*(\d+)\s*\/\s*(\d+)/i.exec(r.text||"");if(m){const p=prog();p.s=p.s||{};const k2=s.id+"-full",e=p.s[k2]||(p.s[k2]={best:0});e.best=Math.max(e.best,+m[1]);markDay();save()}});return}
  aiMark(`You are an experienced AQA A-level History examiner. A student has written ONE paragraph of a ${s.kind==="interp"?"Question 1 interpretations answer (AO3: analyse and evaluate interpretations using context; never reward provenance)":"Question 1 source-evaluation answer (AO2: assess value of primary sources using provenance, tone, emphasis and context)"}.
Question: ${s.q}
${it.label}${it.prov?" ("+it.prov+")":""}: "${it.text}"
Model paragraph for reference: "${model}"
Student paragraph: """${txt.slice(0,4000)}"""
Reply in UK English, under 200 words, exactly in this format:
**Verdict:** Level 1–5 quality for this paragraph, plus one sentence why
**Strengths**
- 2 bullets
**Fix these**
- 3 specific bullets (e.g. missing argument, vague evidence, no judgement, comparing extracts, judging provenance for interpretations)
**Upgrade** rewrite their weakest sentence better.`,out,$("kmark"),"🧑‍🏫 Mark again");
}
async function kMarkFull(){
  const s=K.s,txt=($("kfull").value||"").trim(),out=$("kfmk");
  if(txt.length<200){out.innerHTML='<div class="ai">Write more first. A full answer is usually 600+ words.</div>';return}
  const r=await aiMark(`You are an experienced AQA A-level History examiner marking Question 1 (${s.m} marks, ${s.kind==="interp"?"AO3 interpretations: assess how convincing each extract's argument is using contextual knowledge; no credit for provenance or comparing extracts":"AO2 sources: assess the value of each source for the enquiry using provenance, tone, emphasis and context"}).
Question: ${s.q}
${s.items.map(it=>it.label+(it.prov?" ("+it.prov+")":"")+': "'+it.text+'"').join("\n")}
Student answer: """${txt.slice(0,9000)}"""
Use AQA's 5-level mark scheme. Reply in UK English, under 260 words:
**Estimated mark: X/${s.m} (Level N)**
**Extract/Source by extract/source** one line each on how well it was handled
**Biggest strengths**
- 2 bullets
**To reach the next level**
- 3 specific bullets`,out,$("kfm"),"🧑‍🏫 Mark again");
  const m=r&&/Estimated mark:\s*(\d+)\s*\/\s*(\d+)/i.exec(r.text||"");
  if(m){const p=prog();p.s=p.s||{};const k=s.id+"-full",e=p.s[k]||(p.s[k]={best:0});e.best=Math.max(e.best,+m[1]);e.last=+m[1];markDay();save();out.insertAdjacentHTML("beforeend",`<p class="hint">Saved. Your best full answer is ${e.best}/${s.m}.</p>`)}
}
/* maths multi-part */
function numParse(v){v=String(v).trim().replace(/\s/g,"").replace("−","-").replace("°","");if(/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(v)){const[a,b]=v.split("/");return +a/+b}return v===""?NaN:Number(v)}
function renderMq(){
  if(mode!=="skills"||!K)return;
  const s=K.s;K.mres=K.mres||{};K.hints=K.hints||{};K.sols=K.sols||{};
  let html=`<button class="link" onclick="K=null;skillsList()">← All questions</button><div class="card"><div class="meta"><span class="pill">${s.title}</span><span class="pill g">${s.parts.reduce((a,p)=>a+p.m,0)} marks</span></div><div class="q" style="margin:0">${s.q}</div></div>`;
  s.parts.forEach((pt,i)=>{
    if(i>K.part)return;const r=K.mres[i];
    html+=`<div class="card stepc"><div class="meta"><span class="pill">Part ${i+1} of ${s.parts.length}</span><span class="pill g">${pt.m} mark${pt.m>1?"s":""}</span>${r?(r.ok?'<span class="pill m">✓ Correct</span>':'<span class="pill w">Revealed</span>'):""}</div><div class="q">${pt.p}</div>
    ${r&&r.ok?"":`<div class="ansrow"><input id="mi${i}" inputmode="decimal" placeholder="Your answer" value="${esc(K["v"+i]||"")}" oninput="K['v${i}']=this.value" onkeydown="if(event.key==='Enter')mCheck(${i})"><button class="btn sm" onclick="mCheck(${i})">Check</button></div><div id="mf${i}"></div>`}
    ${(K.hints[i]||0)>0?pt.hint.slice(0,K.hints[i]).map(h=>`<div class="hintb">💡 ${h}</div>`).join(""):""}
    ${K.sols[i]?pt.sol.map(x=>`<div class="step">${x}</div>`).join(""):""}
    <div class="btns">${(K.hints[i]||0)<pt.hint.length&&!K.sols[i]?`<button class="btn ghost sm" onclick="K.hints[${i}]=(K.hints[${i}]||0)+1;renderMq()">💡 Hint</button>`:""}${!K.sols[i]?`<button class="btn ghost sm" onclick="K.sols[${i}]=1;if(!K.mres[${i}]){K.mres[${i}]={ok:false};K.max+=${pt.m}}renderMq()">Show method</button>`:""}${(r)&&i===K.part&&i+1<s.parts.length?`<button class="btn sm" onclick="K.part++;renderMq()">Next part →</button>`:""}</div></div>`;
  });
  const fin=s.parts.every((_,i)=>K.mres[i]);
  if(fin){if(!K.saved){K.saved=true;kSave()}const pct=Math.round(K.score/K.max*100);
    html+=`<div class="card" style="text-align:center"><div class="big">${K.score}/${K.max}</div><p class="hint">${pct}% of marks without seeing the method${pct===100?". Exam-ready.":". Try it again tomorrow without hints."}</p>
    ${AI?`<div style="text-align:left"><p class="hint">Want your method checked? Write out your full working and Claude will mark it like an Edexcel examiner (M and A marks).</p><textarea id="mw" placeholder="Your full working for all parts…"></textarea><div class="btns"><button class="btn" id="mwb" onclick="mWork()">🧑‍🏫 Check my working</button></div><div id="mwo"></div></div>`:""}
    <div class="btns"><button class="btn ghost" onclick="openSet('${s.id}')">Retry</button><button class="btn ghost" onclick="K=null;skillsList()">More questions</button></div></div>`}
  $("app").innerHTML=html;
}
function mCheck(i){
  const pt=K.s.parts[i],v=numParse(($("mi"+i)||{}).value||""),f=$("mf"+i);
  if(isNaN(v)){f.innerHTML='<div class="hintb">Enter a number. Fractions like 4/3 are fine.</div>';return}
  const tol=pt.tol!=null?pt.tol:0.005,ok=Math.abs(v-pt.ans)<=tol;
  K.tries=K.tries||{};K.tries[i]=(K.tries[i]||0)+1;
  if(ok){if(!K.mres[i]){const earned=K.sols[i]?0:(K.hints[i]?Math.max(1,pt.m-K.hints[i]):pt.m);K.mres[i]={ok:true};K.max+=pt.m;K.score+=earned}K.sols[i]=1;renderMq()}
  else f.innerHTML=`<div class="hintb bad">✗ Not quite (attempt ${K.tries[i]}). Check your working, or take a hint.</div>`;
}
function mWork(){
  const s=K.s,txt=($("mw").value||"").trim(),out=$("mwo");
  if(txt.length<20){out.innerHTML='<div class="ai">Write out your working first.</div>';return}
  aiMark(`You are an Edexcel A-level Maths examiner. Check this student's working for the question below. Award M (method) and A (accuracy) marks per part, point out the first error in each part, and note any missing steps an examiner would need to see (e.g. justifying a maximum, changing limits). UK English, under 220 words, using bullet points per part, ending with **Estimated total: X/${s.parts.reduce((a,p)=>a+p.m,0)}**.
Question: ${strip(s.q)}
${s.parts.map(p=>strip(p.p)+" ["+p.m+" marks] Correct method: "+p.sol.map(strip).join(" ; ")).join("\n")}
Student working: """${txt.slice(0,6000)}"""`,out,$("mwb"),"🧑‍🏫 Check again");
}
