let C={};
function startCards(list){
  if(sub==="maths")S.maths.cards=mode==="mcards"?S.maths.mcards:S.maths.fcards;
  let items=list||pool("cards");
  if(!items.length){$("app").innerHTML='<div class="card">No flashcards here.</div>';return}
  if(!list){const by=b=>shuffle(items.filter(x=>{const k=cBox(x.id);return b(k)}));items=[...by(k=>k===0),...by(k=>k===-1),...by(k=>k===1),...by(k=>k===2),...by(k=>k>=3)]}
  C={deck:items,flipped:false,done:0,total:items.length,drill:!!list};renderC();
}
function boxLabel(k){return k<0?'<span class="pill g">New</span>':k===0?'<span class="pill w">Struggling</span>':k>=3?'<span class="pill m">Mastered</span>':`<span class="pill g">Box ${k}/3</span>`}
function renderC(){
  if(!C.deck.length){nav();$("app").innerHTML=`<div class="card" style="text-align:center"><div class="big">🎉</div><b>Deck cleared</b><p class="hint">All ${C.total} cards done. Cards you know move up a box, and ones you miss drop back to "Struggling" and come up first next time.</p><div class="btns"><button class="btn" onclick="startCards()">Go again</button></div></div>`;return}
  const c=C.deck[0],tp=S[sub].topics[c.t];
  $("app").innerHTML=`${C.drill?'<div class="seg"><button class="on">🎯 Weak-card drill</button><button onclick="startCards()">Exit drill</button></div>':""}<div class="bar"><div style="width:${C.done/C.total*100}%"></div></div>
  <div class="card flash ${C.flipped?'back':''}" onclick="flip()"><div class="meta" style="justify-content:center"><span class="pill">${tp}</span>${boxLabel(cBox(c.id))}</div><div class="side">${C.flipped?"Answer":"Say it out loud, then tap"}</div>
  <div class="txt ${sub==="maths"&&mode==="mcards"&&!C.flipped?"mq":""}">${C.flipped?rich(c.b):c.f}</div></div>
  ${C.flipped?`<div class="btns"><button class="btn bad" onclick="again()">✗ Again</button><button class="btn good" onclick="known()">✓ Got it</button></div>`:`<p class="hint" style="text-align:center">${C.deck.length} left in this deck</p>`}`;
}
function flip(){if(!C.flipped){C.flipped=true;renderC()}}
function known(){const c=C.deck.shift();recC(c.id,true);C.done++;C.flipped=false;renderC()}
function again(){const c=C.deck.shift();recC(c.id,false);C.deck.splice(Math.min(3,C.deck.length),0,c);C.flipped=false;renderC()}

  <div class="btns">${E.i>0?`<button class="btn ghost" onclick="E.i--;E.shown=0;renderE();scrollTo(0,0)">← Prev</button>`:""}${E.i+1<E.items.length?`<button class="btn ghost" onclick="E.i++;E.shown=0;renderE();scrollTo(0,0)">Next question →</button>`:""}</div></div>`;

async function markIt(){
  const it=E.items[E.i],txt=($("ans").value||"").trim(),out=$("mark");

  $("markb").disabled=true;$("markb").textContent="Marking…";out.innerHTML='<div class="ai">Reading your answer…</div>';
  const isMaths=sub==="maths",scheme=it.plan.filter(p=>!p.startsWith("DIAGRAM:")).map(p=>"- "+strip(p)).join("\n");
  const prompt=`You are an experienced, honest ${LOOK[sub].board} examiner marking a student's mock practice.
Question (${it.m} marks): ${strip(it.q)}
Indicative content / model ${isMaths?"solution":"plan"}:
${scheme}

Student's ${isMaths?"working":"answer or plan"}:
"""${txt.slice(0,6000)}"""

${isMaths?"Check each step. Award method (M) and accuracy (A) marks as Edexcel would.":"If it is only a plan, judge what level the plan would reach if written up well. Use the exam board's level descriptors."}${sub==="econ"?" Reward correct diagrams described in words (axes, curves, shifts, areas).":""}
Reply in UK English, under 220 words, in exactly this format:
**Estimated mark: X/${it.m}**${isMaths?"":" (Level N)"}
**What's good**
- 2–3 bullets
**To push it higher**
- 3 specific, actionable bullets referring to what they wrote
**Try this** one improved sentence or step they could use.`;
  try{
    const r=await AI(prompt,{modelTier:"default",onText:({text})=>{out.innerHTML='<div class="ai">'+md(text)+'</div>'}});
    const m=/Estimated mark:\s*(\d+(?:\.\d+)?)\s*\/\s*(\d+)/i.exec(r.text||"");
    if(m){const sc=Math.min(+m[1],it.m),p=prog(),e=p.e[it.id]||(p.e[it.id]={best:0,n:0});e.n++;e.last=sc;e.best=Math.max(e.best,sc);markDay();save();
      out.insertAdjacentHTML("beforeend",`<p class="hint">Saved. Your best on this question is ${e.best}/${it.m}.</p>`)}
  }catch(e){out.innerHTML='<div class="ai">'+(e&&e.code==="rate_limited"?"Claude's busy. Try again in a minute.":e&&e.code==="not_granted"?"AI marking isn't switched on for this view.":"Couldn't reach Claude just now. Try again.")+'</div>';if(e&&e.code==="not_granted")AI=null}
  const b=$("markb");if(b){b.disabled=false;b.textContent="🧑‍🏫 Mark again"}

X("Support",SUPQ,["Prince Arthur died in 1502 and Queen Elizabeth in 1503","The Yorkist Edmund de la Pole fled abroad in 1501, a continuing threat","Use of bonds increased sharply in the later reign","Lambert Simnel was defeated at Stoke in 1487","The Pilgrimage of Grace in 1536"],[0,1,2],"Simnel is early-reign context that doesn't support a post-1502 turning point. The Pilgrimage is Henry VIII."),
X("Challenge",CHQ,["Sir William Stanley, close to the throne, was executed in 1495, showing suspicion before 1502","Henry backdated his reign to before Bosworth to attaint enemies in 1485","Attainders and bonds were already being used in the 1490s","Arthur's death left Henry with one male heir","The Six Articles in 1539"],[0,1,2],"Arthur's death supports C. The key challenge is that Henry was ruthless well before 1502."),
M("Judgement","How convincing is Extract C overall?",["Mostly convincing: the chronology fits the evidence, though Henry was already ruthless before 1502 (e.g. Stanley, 1495)","Unconvincing: nothing changed in 1502","Convincing because it gives dates","Unconvincing because it doesn't mention Wolsey"],0,"A strong verdict accepts the argument's core and qualifies it with precise evidence."),
W("Extract C argues that 1502–03 was a turning point, with Henry's control tightening after the deaths of Arthur and Elizabeth. This is largely convincing: with only one young heir and Yorkist claimants such as Edmund de la Pole abroad, the dynasty looked vulnerable, and the use of bonds and the activity of the Council Learned increased markedly afterwards. However, the extract overstates the contrast with the 1490s. Henry had already shown ruthlessness towards men close to the throne, executing Sir William Stanley in 1495, and he had used attainders from the start of the reign. C is convincing on the intensification of control, less so on the idea of a sudden change.")]}
]},
{id:"t2",title:"Henry VIII and religion",m:30,kind:"interp",q:"Using your understanding of the historical context, assess how convincing the arguments in these three extracts are in relation to Henry VIII's religious changes, 1529–47.",
items:[
{label:"Extract A",text:"The break with Rome was not the product of religious conviction. Henry wanted a son and a new wife, and when the pope would not give him an annulment he found another route. Every major step between 1529 and 1534 can be traced back to the 'Great Matter'. Had Clement VII been free of Charles V's influence, England might well have remained within the Roman Church.",
steps:[M("Argument","What is the extract's overall argument?",["The break with Rome was driven by the annulment and the need for an heir, not religion","Henry was a committed Protestant","The break was driven by Parliament","Henry wanted the Church's wealth"],0,"The 'Great Matter' is the annulment of Henry's marriage to Catherine of Aragon."),
X("Support",SUPQ,["Charles V, Catherine's nephew, dominated Rome after the sack of 1527","The Act in Restraint of Appeals (1533) let Cranmer annul the marriage","Anne Boleyn was pregnant by early 1533, creating urgency","The dissolution brought the Crown huge wealth","The Six Articles (1539)"],[0,1,2],"Wealth points to a different motive. The Six Articles are about doctrine later on."),
X("Challenge",CHQ,["Henry never returned to Rome even after Anne's death in 1536","The dissolution and Valor Ecclesiasticus show a desire for Church wealth","Henry's 'imperial' claims went far beyond what an annulment needed","Wolsey fell in 1529 after failing to secure the annulment","Thomas More resigned as Lord Chancellor in 1532"],[0,1,2],"Wolsey's fall supports A. More's resignation is broadly neutral."),
M("Judgement","How convincing is Extract A overall?",["Partly convincing: the annulment explains the timing, but the scope and permanence of the supremacy suggest power and wealth mattered too","Fully convincing","Unconvincing: the annulment was irrelevant","Unconvincing because it is too short"],0,"Distinguish the trigger (annulment) from the wider motives that sustained the change."),
W("Extract A argues that the break with Rome was driven by Henry's need for an annulment rather than by religious conviction. This is convincing as an explanation of timing: Charles V's control over Clement VII after 1527 blocked the annulment, and the Act in Restraint of Appeals in 1533 was passed so that Cranmer could annul the marriage once Anne was pregnant. However, the extract is less convincing as a full explanation. Henry never returned to Rome after Anne's execution in 1536, and the supremacy was used to seize monastic wealth, which suggests that power and money became motives in their own right.")]},
{label:"Extract B",text:"Once Henry had tasted supremacy, he would not give it up. The Royal Supremacy gave the Crown control over the Church's courts, its appointments and, above all, its wealth. The dissolution of the monasteries transferred vast estates to the king. Religion was a means to royal power; the doctrinal swings of the 1530s and 1540s followed political convenience rather than belief.",
steps:[M("Argument","What is the extract's overall argument?",["Power and wealth drove Henry's religious policy, and doctrine followed politics","Henry was driven by sincere Catholic belief","Henry's ministers controlled religious policy","The Church reformed itself"],0,"Look at the last sentence: 'religion was a means to royal power'."),
X("Support",SUPQ,["The Valor Ecclesiasticus (1535) and dissolutions (1536, 1539) transferred huge wealth","The Treason Act (1534) enforced acceptance of the supremacy","More and Fisher were executed in 1535 for refusing to accept it","Henry personally edited the King's Book (1543)","The Amicable Grant (1525)"],[0,1,2],"Henry's personal involvement in doctrine challenges B. The Amicable Grant is the wrong topic."),
X("Challenge",CHQ,["Henry wrote a defence of the sacraments in 1521 and was named 'Defender of the Faith'","Henry personally shaped doctrine, e.g. the King's Book of 1543","Much monastic land was sold off quickly, not kept","The Court of Augmentations managed monastic income","The Treason Act 1534"],[0,1,2],"The Court of Augmentations and the Treason Act support B's argument about power and wealth."),
M("Judgement","How convincing is Extract B overall?",["Partly convincing on outcomes (wealth, control), but it underrates Henry's personal theological convictions","Fully convincing","Unconvincing: Henry gained no wealth","Unconvincing because it ignores Wolsey"],0,"Credit its strengths, then use Henry's personal theology to qualify it."),
W("Extract B argues that Henry's religious policy was driven by the desire for power and wealth, with doctrine following political convenience. This is convincing about the consequences of the supremacy: the Valor Ecclesiasticus and the dissolutions transferred enormous wealth to the Crown, and the Treason Act and the executions of More and Fisher show the supremacy being enforced ruthlessly. However, the claim that doctrine simply followed convenience is less convincing. Henry had a genuine interest in theology, from his 1521 defence of the sacraments to his personal editing of the King's Book in 1543, and much monastic land was quickly sold rather than kept.")]},
{label:"Extract C",text:"Henry VIII's Church remained recognisably Catholic. The mass, transubstantiation and clerical celibacy survived, and the Act of Six Articles of 1539 enforced them with the threat of death. What changed was who stood at its head. Reformers such as Cranmer won occasional victories, like the English Bible, but by the King's Book of 1543 the tide had turned firmly back towards tradition.",
steps:[M("Argument","What is the extract's overall argument?",["Henry's Church stayed Catholic in doctrine: 'Catholicism without the pope'","Henry created a Protestant Church","The reformers won","The Church of England was abolished"],0,"Change of headship, continuity of doctrine."),
X("Support",SUPQ,["The Act of Six Articles (1539) upheld transubstantiation and clerical celibacy","The King's Book (1543) was doctrinally conservative","The Act for the Advancement of True Religion (1543) restricted Bible reading","The Ten Articles (1536) recognised only three sacraments","The 1538 Injunctions ordered an English Bible in every parish"],[0,1,2],"The Ten Articles and the Injunctions both show reform, so they challenge C."),
X("Challenge",CHQ,["The Ten Articles (1536) recognised only three sacraments","The 1538 Injunctions attacked shrines and pilgrimages and ordered an English Bible","The monasteries were dissolved, ending English monasticism","The Six Articles (1539)","Henry burned Protestant heretics"],[0,1,2],"The Six Articles and the burning of Protestants support C's argument."),
M("Judgement","How convincing is Extract C overall?",["Largely convincing on doctrine, but it understates real changes in practice (monasteries, shrines, the English Bible) that opened the way for Protestantism","Unconvincing: Henry was a Protestant","Fully convincing: nothing changed","Unconvincing because it ignores money"],0,"Distinguish doctrine (belief) from practice (what people experienced in parishes)."),
W("Extract C argues that Henry's Church remained Catholic in doctrine, with only the headship changing. This is largely convincing: the Six Articles of 1539 enforced transubstantiation and clerical celibacy on pain of death, and the King's Book and the Act for the Advancement of True Religion in 1543 marked a conservative turn. However, the extract understates the real changes to religious practice. The Ten Articles reduced the sacraments to three, the 1538 Injunctions attacked shrines and ordered an English Bible in every parish, and the dissolution ended monasticism. These changes made later Protestant reform under Edward VI far easier.")]}
]}],
russia:[
{id:"r1",title:"The NEP, 1921–28",m:25,kind:"source",q:"With reference to these sources and your understanding of the historical context, assess the value of these three sources to an historian studying the New Economic Policy.",
items:[
{label:"Source A",prov:"Practice source: from a speech by a senior Bolshevik leader to the 10th Party Congress, March 1921.",text:"We must be honest: the peasantry is not satisfied with the relations we have had with it. Kronstadt has shown us this. We cannot go on taking grain by force. We shall replace requisitioning with a tax, and let the peasant trade what remains. This is a retreat, comrades, but a temporary one, so that we may later advance. The commanding heights of the economy will remain in our hands.",
steps:[M("Provenance: value","What does the provenance make this source valuable for?",["A senior leader at the Congress that launched the NEP reveals the official reasoning and justification at the time","It is neutral and objective","It was written with hindsight","It is a private letter, so it must be honest"],0,"Who, when, where and to whom: an insider at the moment of decision."),
M("Provenance: limitation","What is its main limitation?",["Speaking to a divided party, he needs to justify an ideological retreat, so he presents the NEP as 'temporary' and may downplay how desperate things were","It was written by a foreigner","It is too late to be useful","Speeches are always false"],0,"Think purpose and audience: persuading Bolsheviks uneasy about the return of capitalism."),
X("Context",'Tick ALL the context that confirms the source\'s content',["The Kronstadt mutiny in March 1921 shocked the leadership","A tax in kind replaced grain requisitioning","Heavy industry, banks and foreign trade stayed under state control","The NEP allowed large private factories to be privatised","Collectivisation began in 1921"],[0,1,2],"Only small businesses were privatised. Collectivisation came in 1929."),
M("Judgement","Overall value for studying the NEP?",["High value for the government's motives and how the NEP was sold to the party, but less for how it worked in practice","No value because it's propaganda","Complete value: it tells us everything","Low value because it is only a speech"],0,"Value is always for this enquiry. Say what it is good for and what it is not."),
W("Source A is valuable for revealing why the Bolshevik leadership introduced the NEP. Delivered at the 10th Party Congress in March 1921, it shows the immediate reaction to the Kronstadt mutiny and the decision to replace requisitioning with a tax in kind, while keeping the 'commanding heights' in state hands. Its purpose, persuading a party that saw the NEP as a betrayal, explains the stress on a 'temporary retreat'. This may play down the scale of the crisis, which included famine and peasant revolts such as Tambov. It is therefore highly valuable for official motives, less so for the NEP's effects.")]},
{label:"Source B",prov:"Practice source: a letter from a Petrograd factory worker to his brother in the countryside, 1922.",text:"The shops are full again, but who can buy? The Nepmen ride in carriages and eat in restaurants while we wait for our wages. My mates ask what we fought the Whites for. They say the bourgeois have come back through the back door. You in the village at least can sell your grain.",
steps:[M("Provenance: value","What does the provenance make this source valuable for?",["A private letter from an ordinary worker gives an urban, non-official view that is unlikely to have been written as propaganda","It represents all Soviet workers","It was written by a government official","It is a statistical report"],0,"Private and personal: the value lies in genuine feeling."),
M("Provenance: limitation","What is its main limitation?",["One individual in Petrograd: it may be exaggerated in anger and may not be typical of all workers or of the countryside","It was written too early","Letters can't be used by historians","It is propaganda"],0,"Typicality and emotional tone are the key limitations of a personal source."),
X("Context",'Tick ALL the context that confirms the source\'s content',["Nepmen (private traders) were widely resented","Urban unemployment rose under the NEP","Peasants could sell their surplus on the market","Food shortages were worse in 1922 than in 1920","The First Five-Year Plan began in 1922"],[0,1,2],"Supplies improved under the NEP. The Five-Year Plan began in 1928."),
M("Judgement","Overall value?",["Valuable for working-class resentment and ideological unease about the NEP, but limited in how typical it is","No value: it's just one person","The most valuable source because it is honest","Only valuable for the Civil War"],0,"Tie the value back to the NEP: it shows its social and political tensions."),
W("Source B is valuable for showing how some urban workers experienced the NEP. As a private letter written in 1922, it is unlikely to be propaganda, and its anger at Nepmen 'in carriages' reflects real resentment of private traders and the rise in urban unemployment under the NEP. Its sense that 'the bourgeois have come back' mirrors the ideological unease within the party itself. However, it is one worker's view from Petrograd, written in frustration, and it ignores the NEP's success in restoring supplies. It is valuable for attitudes, less for economic outcomes.")]},
{label:"Source C",prov:"Practice source: from a confidential report by a local Soviet official on grain markets in the Volga region, 1925.",text:"Harvests have recovered and the markets are busy. However, a stratum of richer peasants is emerging, hiring labour and holding back grain until prices rise. Poorer peasants grow resentful. Unless action is taken, the towns may again face shortages.",
steps:[M("Provenance: value","What does the provenance make this source valuable for?",["A confidential internal report based on local observation, so the official had less reason to give a rosy, propagandist picture","It was published to persuade the public","It was written by a kulak","It covers the whole USSR"],0,"Confidential plus first-hand equals candour."),
M("Provenance: limitation","What is its main limitation?",["It covers one region, and the official may stress the kulak 'problem' to fit party ideology or please superiors","It is too short","It was written after the NEP ended","Officials never tell the truth"],0,"Ideology shapes what officials notice and report."),
X("Context",'Tick ALL the context that confirms the source\'s content',["Agricultural output was close to 1913 levels by the mid-1920s","Peasants withheld grain when prices were low (e.g. the scissors crisis, 1923)","A grain procurement crisis hit in 1927–28","Hiring labour was banned for peasants throughout the NEP","Collectivisation was complete by 1925"],[0,1,2],"Hiring labour was permitted from 1925. Collectivisation came after 1929."),
M("Judgement","Overall value?",["Highly valuable for showing both the NEP's success and the tensions that led to its abandonment","No value: it's from one region","Only valuable for collectivisation","Low value because it is confidential"],0,"It links the NEP's recovery to the 1928 'Great Turn'."),
W("Source C is highly valuable for assessing the NEP because it shows both its success and its emerging problems. As a confidential report, the official had little reason to exaggerate, and the recovery of harvests matches the return of output to near 1913 levels by the mid-1920s. The warning about richer peasants holding back grain anticipates the procurement crisis of 1927–28 that Stalin used to justify ending the NEP. However, it covers one region, and its focus on a kulak 'stratum' may reflect party ideology. Overall it is valuable for explaining why the NEP was abandoned.")]}
]},
{id:"r2",title:"The Stakhanovite movement",m:25,kind:"source",q:"With reference to these sources and your understanding of the historical context, assess the value of these three sources to an historian studying the effectiveness of the Stakhanovite movement.",
items:[
{label:"Source A",prov:"Practice source: from a front-page article in a Soviet national newspaper, September 1935.",text:"The miner Stakhanov has shown what the Soviet worker can do when freed from capitalist exploitation. In one shift he cut 102 tonnes of coal, fourteen times the norm. Across the Union, workers are rising to his challenge. Old norms are being smashed; the slackers and the doubters are being swept aside.",
steps:[M("Provenance: value","What does the provenance make this source valuable for?",["The official press shows how the regime wanted the movement presented and the message it sent to workers","It is objective economic data","It was written by Stakhanov's enemies","It is a secret report"],0,"Official newspaper equals regime intentions and propaganda techniques."),
M("Provenance: limitation","What is its main limitation?",["As state-controlled propaganda it hides that the record was staged, with helpers doing the support work","It is too late to be useful","It was written abroad","It is only about steel"],0,"The record shift was carefully prepared. The press would never admit that."),
X("Context",'Tick ALL the context that confirms the source\'s content',["Stakhanov cut 102 tonnes on 31 August 1935","Stakhanovites were rewarded with bonuses, better housing and holidays","The Second Five-Year Plan stressed raising productivity","Stakhanov worked at the Magnitogorsk steelworks","The movement began in 1928"],[0,1,2],"Stakhanov was a coal miner in the Donbas. The movement began in 1935."),
M("Judgement","Overall value for studying effectiveness?",["Valuable as evidence of the regime's propaganda aims, but weak evidence of actual effectiveness","Highly valuable: it proves the movement worked","No value at all","Valuable only for collectivisation"],0,"A source can be valuable even when it is unreliable, if you ask the right question of it."),
W("Source A has value mainly as evidence of how the regime promoted the Stakhanovite movement. Published in a national newspaper days after Stakhanov's record of 102 tonnes in August 1935, it shows the propaganda aim of shaming 'slackers' and pushing all workers to beat their norms, in line with the Second Five-Year Plan's focus on productivity. However, as state propaganda it conceals that the record was staged with assistants and the best seam, and its claim that workers everywhere were 'rising to the challenge' cannot be trusted. It is valuable for the regime's aims, not for the movement's real effectiveness.")]},
{label:"Source B",prov:"Practice source: from the memoirs of a former Donbas miner who left the USSR, published in the West in 1952.",text:"When the Stakhanovites came, our lives grew harder. The norms were raised for everyone because of a few men given the best seams and helpers. Some of the lads hid tools from the record-breakers; one was beaten in the washroom. We earned less for more work.",
steps:[M("Provenance: value","What does the provenance make this source valuable for?",["An eyewitness worker's view from inside a mine, free from Soviet censorship","It is official Soviet data","It was written in 1935","It reflects the views of all workers"],0,"Insider plus uncensored equals the ordinary worker's experience."),
M("Provenance: limitation","What is its main limitation?",["Written years later and published in the West during the Cold War by someone who left the USSR, so memory and hostility may shape it","It is propaganda for Stalin","Miners didn't understand the movement","It is too short"],0,"Date, place of publication and the author's motives all matter."),
X("Context",'Tick ALL the context that confirms the source\'s content',["Work norms were raised across industry in 1936","Some Stakhanovites were attacked by fellow workers","Living standards and real wages were low in the 1930s","Trade unions organised strikes to stop the movement","The movement was abolished in 1936"],[0,1,2],"Independent unions and strikes were impossible under Stalin."),
M("Judgement","Overall value?",["Valuable for ordinary workers' experience and resentment, but it must be weighed against its Cold War origins","Worthless because it is anti-Soviet","Completely reliable because it is an eyewitness account","Only valuable for agriculture"],0,"Balance provenance against corroborating context."),
W("Source B is valuable for showing the movement's impact on ordinary workers. As a miner's eyewitness account, free from Soviet censorship, it reveals resentment that official sources hide, and its claims are supported by the raising of norms across industry in 1936 and reports of attacks on Stakhanovites. However, it was published in the West in 1952, during the Cold War, by someone who had left the USSR. Hindsight and hostility may shape it. It is valuable for showing the movement's costs and limited popularity, which suggests it was less effective than the regime claimed.")]},
{label:"Source C",prov:"Practice source: from an internal report by a factory director to the People's Commissariat of Heavy Industry, 1936.",text:"The movement has raised output in several shops by 20–30%. However, record attempts disrupt the work of other brigades, equipment is wearing out faster, and quality has fallen. Some foremen fear being labelled saboteurs if they object.",
steps:[M("Provenance: value","What does the provenance make this source valuable for?",["An internal report to the ministry, with practical concerns, so it is less propagandist and based on direct managerial knowledge","It is a public newspaper","It was written by a foreign journalist","It covers all of Soviet industry"],0,"Internal plus practical equals frank."),
M("Provenance: limitation","What is its main limitation?",["One factory, and a director might exaggerate successes to protect himself or blame problems on others","It was written too late","It is fiction","Directors didn't know about output"],0,"Self-interest in a climate of fear (the 1936 purges)."),
X("Context",'Tick ALL the context that confirms the source\'s content',["Productivity rose in some sectors during the Second Five-Year Plan","Breakages and poor quality were common problems","Accusations of 'wrecking' and sabotage grew as the purges began","Gosplan was abolished in 1936","The movement applied only to agriculture"],[0,1,2],"Gosplan continued. The movement spread across industry."),
M("Judgement","Overall value?",["Highly valuable: balanced and specific, showing both gains and costs","No value: it's only one factory","Low value because it is internal","Only valuable for the Civil War"],0,"This is often the 'most valuable' source: balanced, specific and frank."),
W("Source C is the most valuable of the three for judging the movement's effectiveness. As an internal report to the Commissariat, it is frank and specific: it acknowledges real output gains of 20–30%, consistent with productivity rises during the Second Five-Year Plan, but also records disruption, equipment wear and falling quality. Its reference to foremen fearing the 'saboteur' label reflects the growing climate of the purges. Its limitations are that it covers one factory and that the director may present results to protect himself. Overall it suggests the movement raised output in places, at significant cost.")]}
]}],
maths:[
{id:"m1",title:"Cubic: stationary points & area",q:"The curve C has equation y = x³ – 6x² + 9x + 1.",parts:[
{p:"(a) Find the x-coordinate of the local maximum.",m:4,ans:1,hint:["Differentiate and set dy/dx = 0.","3x² – 12x + 9 = 0 → x² – 4x + 3 = 0"],sol:["dy/dx = 3x² – 12x + 9 = 3(x – 1)(x – 3) = 0","x = 1 or x = 3","d²y/dx² = 6x – 12. At x = 1 it equals –6 < 0, so it's a maximum.","<b>x = 1</b>"]},
{p:"(b) Find the y-coordinate of the local maximum.",m:1,ans:5,hint:["Substitute x = 1 into the original equation."],sol:["y = 1 – 6 + 9 + 1 = <b>5</b>"]},
{p:"(c) Find the exact area between C, the x-axis and the lines x = 0 and x = 3.",m:4,ans:9.75,hint:["C is above the x-axis on [0, 3] (minimum y = 1 at x = 3).","Integrate term by term, then substitute the limits."],sol:["∫₀³ (x³ – 6x² + 9x + 1) dx = [x⁴/4 – 2x³ + 9x²/2 + x]₀³","= 81/4 – 54 + 81/2 + 3","= <b>39/4 = 9.75</b>"]}]},
{id:"m2",title:"Trig equation via identity",q:"Solve 2sin²x + 3cos x = 0 for 0° ≤ x < 360°.",parts:[
{p:"(a) Using sin²x = 1 – cos²x, the equation becomes 2cos²x – 3cos x – 2 = 0. Solve for cos x. Enter the valid value.",m:2,ans:-0.5,hint:["Factorise: (2cos x + 1)(cos x – 2) = 0","cos x = 2 is impossible."],sol:["2 – 2cos²x + 3cos x = 0 → 2cos²x – 3cos x – 2 = 0","(2cos x + 1)(cos x – 2) = 0","cos x = 2 has no solutions, so <b>cos x = –½</b>"]},
{p:"(b) Give the smaller solution for x (degrees).",m:1,ans:120,hint:["cos⁻¹(–½) = 120°"],sol:["x = <b>120°</b>"]},
{p:"(c) Give the larger solution for x (degrees).",m:1,ans:240,hint:["Use the symmetry of cos: 360° – 120°."],sol:["x = 360° – 120° = <b>240°</b>"]}]},
{id:"m3",title:"Exponential growth model",q:"A population is modelled by P = 500e<sup>0.04t</sup>, where t is in years.",parts:[
{p:"(a) State the initial population.",m:1,ans:500,hint:["Put t = 0: e⁰ = 1."],sol:["P = 500e⁰ = <b>500</b>"]},
{p:"(b) Find P when t = 10, to the nearest whole number.",m:2,ans:746,tol:0.6,hint:["500e<sup>0.4</sup>"],sol:["P = 500e<sup>0.4</sup> = 745.9…","<b>746</b>"]},
{p:"(c) Find the time taken for the population to double (1 d.p.).",m:3,ans:17.3,tol:0.06,hint:["Set 500e<sup>0.04t</sup> = 1000, then take ln of both sides."],sol:["e<sup>0.04t</sup> = 2","0.04t = ln 2","t = ln 2 / 0.04 = 17.33… ≈ <b>17.3 years</b>"]},
{p:"(d) Find the rate of increase when t = 10 (1 d.p.).",m:2,ans:29.8,tol:0.06,hint:["dP/dt = 0.04 × 500e<sup>0.04t</sup> = 20e<sup>0.04t</sup>"],sol:["dP/dt = 20e<sup>0.4</sup> = 29.83…","≈ <b>29.8 per year</b>"]}]},
{id:"m4",title:"Integration by parts & substitution",q:"Evaluate the following integrals.",parts:[
{p:"(a) ∫₁<sup>e</sup> x ln x dx (3 d.p.)",m:5,ans:2.097,tol:0.002,hint:["Use u = ln x, dv/dx = x (LATE: logs first).","= (x²/2)ln x – ∫ x/2 dx"],sol:["= [ (x²/2)ln x – x²/4 ]₁<sup>e</sup>","= (e²/2 – e²/4) – (0 – ¼)","= (e² + 1)/4 ≈ <b>2.097</b>"]},
{p:"(b) ∫₀² x√(x² + 5) dx, using u = x² + 5 (3 d.p.)",m:5,ans:5.273,tol:0.002,hint:["du = 2x dx, so x dx = ½ du.","New limits: x = 0 → u = 5, x = 2 → u = 9"],sol:["= ½ ∫₅⁹ u<sup>½</sup> du = ⅓ [u<sup>3/2</sup>]₅⁹","= ⅓ (27 – 5√5)","≈ <b>5.273</b>"]}]},
{id:"m5",title:"General binomial expansion",q:"f(x) = (1 – 4x)<sup>½</sup>",parts:[
{p:"(a) The expansion up to x² is 1 + Ax + Bx². Enter A.",m:1,ans:-2,hint:["The x term is n(–4x) with n = ½."],sol:["½ × (–4x) = –2x, so <b>A = –2</b>"]},
{p:"(b) Enter B.",m:2,ans:-2,hint:["n(n – 1)/2! × (–4x)²"],sol:["(½)(–½)/2 × 16x² = –2x², so <b>B = –2</b>"]},
{p:"(c) The expansion is valid for |x| < k. Enter k.",m:1,ans:0.25,hint:["|4x| < 1"],sol:["|–4x| < 1, so |x| < ¼. <b>k = 0.25</b>"]},
{p:"(d) Use x = 0.01 in your expansion to estimate √0.96 (4 d.p.).",m:2,ans:0.9798,tol:0.00006,hint:["1 – 2(0.01) – 2(0.01)²"],sol:["1 – 0.02 – 0.0002 = <b>0.9798</b> (the true value is 0.97979…)"]}]},
{id:"m6",title:"Circle from a diameter",q:"Points A(1, 2) and B(7, 10) are the ends of a diameter of circle C.",parts:[
{p:"(a) Find the gradient of AB.",m:1,ans:4/3,tol:0.01,hint:["(y₂ – y₁)/(x₂ – x₁)"],sol:["8/6 = <b>4/3</b>"]},
{p:"(b) The centre is (p, q). Enter p + q.",m:1,ans:10,hint:["The centre is the midpoint of AB."],sol:["Midpoint (4, 6), so p + q = <b>10</b>"]},
{p:"(c) The equation is (x – 4)² + (y – 6)² = r². Enter r².",m:2,ans:25,hint:["The radius is half of AB. AB = √(6² + 8²)"],sol:["AB = 10, so r = 5","<b>r² = 25</b>"]},
{p:"(d) Find the y-intercept of the tangent to C at B.",m:3,ans:15.25,tol:0.01,hint:["The tangent is perpendicular to the radius. The radius from (4, 6) to B has gradient 4/3.","Tangent gradient = –3/4. Substitute B(7, 10)."],sol:["Tangent: y – 10 = –¾(x – 7)","y = –¾x + 61/4","y-intercept = <b>61/4 = 15.25</b>"]}]}
]};
